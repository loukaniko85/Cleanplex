services:
  cleanplex:
    build: .
    container_name: cleanplex
    ports:
      - "7979:7979"
    volumes:
      - cleanplex-data:/data
      # REQUIRED for local (NudeNet) scanning: the container must see media at the
      # SAME absolute paths Plex reports, or every scan fails with
      # "File not found: /tv/...". Copy the paths from Plex (item → Get Info →
      # View XML → Part file) and mount each prefix read-only, e.g.:
      #   - /mnt/user/media/tv:/tv:ro
      #   - /mnt/user/media/movies:/movies:ro
      # The skip/skip-and-mute engine works without this; only local scanning
      # needs the file paths to be visible inside the container.
      # - /path/to/media:/media:ro
    environment:
      - CLEANPLEX_DATA=/data
      - CLEANPLEX_PORT=7979
    restart: unless-stopped

volumes:
  cleanplex-data:
