name: Build Android bridge

on:
  push:
    branches: [main]
    paths:
      - "android-bridge/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-bridge/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests and debug APK
        working-directory: android-bridge
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cleanplex-bridge-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
