name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn plexapi httpx aiosqlite pyyaml \
            python-multipart Pillow pytest pytest-asyncio pytest-cov
      - name: Run backend tests
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Type-check and unit tests
        run: cd frontend && npx tsc --noEmit && npm test
      - name: Production build
        run: cd frontend && npm run build

  container:
    # v1.0.2 shipped an image that built fine but crashed on startup. Unit tests
    # cannot catch that: build the image and boot it like a user would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cleanplex:ci .
      - name: Boot container and wait for health
        run: |
          docker run -d --name cleanplex-ci -p 7979:7979 cleanplex:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7979/api/health; then
              echo
              echo "Container is healthy"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' cleanplex-ci 2>/dev/null)" != "true" ]; then
              echo "::error::Container exited before becoming healthy"
              docker logs cleanplex-ci
              exit 1
            fi
            sleep 2
          done
          echo "::error::Container did not become healthy within 120s"
          docker logs cleanplex-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs cleanplex-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f cleanplex-ci || true

  e2e:
    # Browser tests against the real app: seeded SQLite database, built React
    # bundle, Chromium. Catches startup/UI failures that unit tests miss.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend
        run: pip install -e .
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          PYTHON: python
        run: |
          cd e2e
          npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
